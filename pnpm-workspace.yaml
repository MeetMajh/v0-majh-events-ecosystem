# pnpm 10 configuration.
#
# WHAT WAS HERE BEFORE, AND WHY IT DID NOTHING:
#
#   allowBuilds:
#     sharp: set this to true or false
#
# `allowBuilds` is real, but it is the pnpm 11+ setting that REPLACED
# `onlyBuiltDependencies`. On pnpm 10 it is an unrecognised key, and pnpm
# does not validate unknown keys in this file, so it was silently inert —
# and the value was a placeholder string where a boolean belongs. The result
# was `Ignored build scripts: sharp@0.34.5` on every install.
#
# WHY sharp NEEDS TO BE LISTED:
#
# pnpm blocks dependency install scripts by default, which is the right
# default — an install script is arbitrary code from a transitive package.
# sharp declares one. Verified that sharp 0.34.5 loads and reports its
# version fine WITHOUT the script, because it ships prebuilt platform
# binaries as optional dependencies and the script is only a fallback. It is
# listed anyway so the install is clean rather than warning, and so a
# platform without a prebuilt binary still works.
#
# This is the only dependency in the tree with an install script — checked by
# reading every package.json under node_modules.
#
# ON UPGRADING TO pnpm 11 OR 12: rename this key to `allowBuilds` with a
# boolean map (`allowBuilds: { sharp: true }`). v11+ also defaults
# `strictDepBuilds: true`, which FAILS the install on unreviewed build
# scripts rather than warning — so this file must be correct before that
# upgrade, not after.

onlyBuiltDependencies:
  - sharp
